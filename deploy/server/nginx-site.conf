# 放进 1Panel 网站 → 配置 → 配置文件（Nginx）的 server 块内
# 替换原有 root 与 location / 配置
root /opt/table-deploy/current;
index index.html;

location = /index.html {
    add_header Cache-Control "no-cache";
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

